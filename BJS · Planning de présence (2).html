<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BJS · Planning de présence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@400;700;900&family=Montserrat:wght@700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--surface:#fbf7ee;--text:#0d0d0d;--muted:#6f675a;--line:#e7dcc4;--gold:#9a7b22;--gold-fill:#d89f3e;--gold-soft:#f6e7c6;--bronze:#8c5a1d;--ink:#0d0d0d;--on-ink:#e8b04a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14110d;--surface:#1e1a15;--text:#f3ecdf;--muted:#a59c8b;--line:#3a3328;--gold:#e0b252;--gold-fill:#d89f3e;--gold-soft:#3b2f18;--ink:#f3ecdf;--on-ink:#14110d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14110d;--surface:#1e1a15;--text:#f3ecdf;--muted:#a59c8b;--line:#3a3328;--gold:#e0b252;--gold-fill:#d89f3e;--gold-soft:#3b2f18;--ink:#f3ecdf;--on-ink:#14110d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Lato,system-ui,-apple-system,"Segoe UI",sans-serif}
.banner{display:block;width:100%;height:auto}
main{max-width:920px;margin:0 auto;padding:18px 16px 32px}
.kicker{font:800 1rem/1.2 Montserrat,Lato,sans-serif;letter-spacing:.02em;text-transform:uppercase;margin:6px 0 0}
h1{font:400 clamp(3rem,11vw,5.2rem)/.95 "Bebas Neue",Impact,"Arial Narrow",sans-serif;margin:0;text-transform:uppercase;letter-spacing:.01em}
.sub{font-weight:700;font-size:1.15rem;margin:2px 0 18px}
h2{font:700 .95rem/1.2 Lato,sans-serif;color:var(--gold);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 10px}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names button{font:700 1.05rem Lato,sans-serif;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px}
.names button i{width:12px;height:12px;border-radius:50%;display:inline-block}
.names button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.names.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.bar h3{margin:0;font:400 2rem/1 "Bebas Neue",Impact,sans-serif;text-transform:uppercase}
.bar button,.tools button{font:700 .9rem Lato,sans-serif;border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{background:var(--surface);text-align:center;font:700 .72rem Lato,sans-serif;color:var(--muted);padding:6px 0;text-transform:uppercase}
.day{background:var(--bg);min-height:88px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.day.out{opacity:.4}
.day.sel{outline:3px solid var(--ink);outline-offset:-3px}
.day.mine{background:var(--gold-soft)}
.day.mine::after{content:"✓";position:absolute;top:2px;right:5px;font-weight:900;color:var(--gold)}
.num{font:700 .8rem Lato,sans-serif;color:var(--muted)}
.day.today .num{color:var(--ink);background:var(--gold-fill);border-radius:4px;padding:0 5px;align-self:flex-start}
.p{display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;line-height:1.25;white-space:nowrap}
.p i{width:8px;height:8px;border-radius:50%;flex:none}
.ini{display:none}
.panel{border-left:4px solid var(--gold-fill);padding:2px 0 2px 14px;margin-top:22px}
.panel h4{margin:0 0 6px;font:900 1.05rem Lato,sans-serif;text-decoration:underline;text-underline-offset:3px;text-transform:capitalize}
.panel ul{margin:0;padding-left:22px}
.panel li{font-weight:700;padding:1px 0}
.panel .none{color:var(--muted);margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.status{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.hrs{margin-top:18px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}.hrs[hidden]{display:none}.hrs h4{margin:0 0 10px;font:900 1rem Lato,sans-serif;text-transform:capitalize}.pre{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.pre button,.hrs .all{font:700 .9rem Lato,sans-serif;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}.pre button:active,.hrs .all:active{background:var(--gold-soft)}.tm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}.tm input{font:inherit;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}.hrs .all{margin-top:12px}
footer{margin-top:26px;color:var(--bronze);font:700 .85rem Lato,sans-serif;text-align:center}
@media (max-width:640px){.day{min-height:64px;padding:3px}.full{display:none}.ini{display:inline}.p{font-size:.68rem}.p i{display:none}.day.mine::after{display:none}.p{background:var(--surface);border-radius:4px;padding:0 3px;border:1px solid var(--line)}}
</style>
</head>

<main>
  <p class="kicker">Planning de présence</p>
  <h1>Qui est là ?</h1>
  <p class="sub">Choisis ton prénom, puis touche les jours où tu es présent(e).</p>

  <h2>1 · Ton prénom</h2>
  <div class="names" id="names"></div>

  <h2>2 · Tes jours de présence</h2>
  <div class="bar">
    <button id="prev" aria-label="Mois précédent">←</button>
    <h3 id="title"></h3>
    <button id="next" aria-label="Mois suivant">→</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="tools">
    <button id="wk">Cocher tous les jours lun–ven du mois</button>
    <button id="clr">Tout décocher ce mois-ci</button>
  </div>
  <p class="status" id="status">Connexion…</p>

  <section class="panel">
    <h4 id="dayTitle"></h4>
    <p class="none" id="who0">Sont présents :</p>
    <ul id="who"></ul>
  </section>
  <section class="hrs" id="hrs" hidden>
    <h4 id="hrsT"></h4>
    <div class="pre">
      <button type="button" data-f="09:00" data-t="18:00">Journée 9h–18h</button>
      <button type="button" data-f="09:00" data-t="12:00">Matin 9h–12h</button>
      <button type="button" data-f="14:00" data-t="18:00">Après-midi 14h–18h</button>
      <button type="button" data-f="18:00" data-t="22:00">Soir 18h–22h</button>
      <button type="button" data-f="" data-t="">Pas d’horaire précis</button>
    </div>
    <div class="tm">De <input type="time" id="hfrom"> à <input type="time" id="hto"></div>
    <button type="button" class="all" id="hall">Appliquer ces horaires à tous mes jours du mois</button>
  </section>
  <footer>bjs.droit.aix@gmail.com · 07 82 28 59 29</footer>
</main>
<script>
(function(){
  var PEOPLE=[
    {k:"lucas-f",n:"Lucas F",i:"LF",c:"#0d0d0d"},
    {k:"lucas-m",n:"Lucas M",i:"LM",c:"#d89f3e"},
    {k:"paul",n:"Paul",i:"P",c:"#8c5a1d"},
    {k:"thea",n:"Théa",i:"T",c:"#b09a4a"},
    {k:"rebecca",n:"Rebecca",i:"R",c:"#a3523a"},
    {k:"lou",n:"Lou",i:"Lo",c:"#5b6b3a"},
    {k:"elisa",n:"Elisa",i:"E",c:"#6b6b6b"}
  ];
  var $=function(i){return document.getElementById(i)};
  function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  var db=null,col=null,me=null,view=new Date(),sel=iso(new Date()),present={};
  view.setDate(1);
  try{me=localStorage.getItem("bjs-me")||null;if(me&&!PEOPLE.some(function(p){return p.k===me}))me=null}catch(e){}
  var months=new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"});
  var longDay=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});

  function who(d){return PEOPLE.filter(function(p){return present[d+"_"+p.k]})}
  function fm(t){if(!t)return "";var a=t.split(":");return (+a[0])+"h"+(a[1]&&a[1]!=="00"?a[1]:"")}
  function hrsText(day,p){var r=present[day+"_"+p.k];if(!r)return "";var f=r.from,t=r.to;if(f&&t)return fm(f)+"–"+fm(t);if(f)return "dès "+fm(f);if(t)return "jusqu’à "+fm(t);return ""}
  function drawNames(){
    var w=$("names");w.textContent="";
    PEOPLE.forEach(function(p){
      var b=document.createElement("button");b.type="button";b.className=me===p.k?"on":"";
      var dot=document.createElement("i");dot.style.background=p.c;b.appendChild(dot);
      b.appendChild(document.createTextNode(p.n));
      b.onclick=function(){me=p.k;try{localStorage.setItem("bjs-me",me)}catch(e){}drawNames();render()};
      w.appendChild(b);
    });
  }
  function render(){
    $("title").textContent=months.format(view);
    var g=$("grid");g.textContent="";
    ["lun","mar","mer","jeu","ven","sam","dim"].forEach(function(n){var d=document.createElement("div");d.className="dow";d.textContent=n;g.appendChild(d)});
    var start=new Date(view);start.setDate(1-((start.getDay()+6)%7));
    var today=iso(new Date());
    for(var i=0;i<42;i++){
      var d=new Date(start);d.setDate(start.getDate()+i);var k=iso(d);
      var c=document.createElement("div");
      c.className="day"+(d.getMonth()!==view.getMonth()?" out":"")+(k===today?" today":"")+(k===sel?" sel":"")+(me&&present[k+"_"+me]?" mine":"");
      var n=document.createElement("div");n.className="num";n.textContent=d.getDate();c.appendChild(n);
      who(k).forEach(function(p){
        var s=document.createElement("div");s.className="p";
        var dot=document.createElement("i");dot.style.background=p.c;s.appendChild(dot);
        var f=document.createElement("span");f.className="full";var ht=hrsText(k,p);f.textContent=p.n+(ht?" · "+ht:"");s.appendChild(f);
        var a=document.createElement("span");a.className="ini";a.textContent=p.i;s.appendChild(a);
        c.appendChild(s);
      });
      (function(key){c.onclick=function(){sel=key;toggle(key)}})(k);
      g.appendChild(c);
    }
    $("dayTitle").textContent=longDay.format(new Date(sel+"T12:00:00"));
    var ul=$("who");ul.textContent="";var ws=who(sel);
    $("who0").style.display=ws.length?"none":"";
    $("who0").textContent="Personne pour l’instant.";
    ws.forEach(function(p){var li=document.createElement("li");var h2=hrsText(sel,p);li.textContent=p.n+(h2?" — "+h2:"");ul.appendChild(li)});
    if(ws.length){var h=document.createElement("p");h.className="none";h.style.margin="0 0 4px";h.textContent="Sont présents :";ul.parentNode.insertBefore(h,ul);var old=ul.parentNode.querySelectorAll("p.none.tmp");[].forEach.call(old,function(o){o.remove()});h.className+=" tmp"}
    else{[].forEach.call(ul.parentNode.querySelectorAll("p.none.tmp"),function(o){o.remove()})}
    drawHours();
  }
  function drawHours(){
    var box=$("hrs"),rec=me&&present[sel+"_"+me];
    box.hidden=!rec;
    if(!rec)return;
    $("hrsT").textContent="Mes horaires · "+longDay.format(new Date(sel+"T12:00:00"));
    if(document.activeElement!==$("hfrom"))$("hfrom").value=rec.from||"";
    if(document.activeElement!==$("hto"))$("hto").value=rec.to||"";
  }
  function saveHours(f,t,day){
    if(!need())return;
    if(f&&t&&t<=f){alert("L’heure de fin doit être après le début.");return}
    col.doc(day+"_"+me).set({date:day,person:me,from:f,to:t,ts:Date.now()}).catch(fail);
  }
  function need(){
    if(!me){var w=$("names");w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake");$("status").textContent="Choisis d’abord ton prénom ci-dessus ↑";return false}
    if(!db){$("status").textContent="Connecte-toi pour remplir le calendrier.";return false}
    return true;
  }
  function fail(){alert("Action refusée : il faut un accès en modification sur cette page.")}
  function toggle(day){
    render();
    if(!need())return;
    var id=day+"_"+me,ref=col.doc(id);
    var p=present[id]?ref.delete():ref.set({date:day,person:me,from:"",to:"",ts:Date.now()});
    p.catch(fail);
  }
  function monthDays(){
    var out=[],d=new Date(view);
    while(d.getMonth()===view.getMonth()){out.push(new Date(d));d.setDate(d.getDate()+1)}
    return out;
  }
  $("wk").onclick=function(){
    if(!need())return;
    Promise.all(monthDays().filter(function(d){var w=d.getDay();return w>0&&w<6&&!present[iso(d)+"_"+me]}).map(function(d){
      var k=iso(d);return col.doc(k+"_"+me).set({date:k,person:me,ts:Date.now()})})).catch(fail);
  };
  $("clr").onclick=function(){
    if(!need())return;
    var mine=monthDays().filter(function(d){return present[iso(d)+"_"+me]});
    if(!mine.length||!confirm("Décocher tes "+mine.length+" jours de ce mois ?"))return;
    Promise.all(mine.map(function(d){return col.doc(iso(d)+"_"+me).delete()})).catch(fail);
  };
  $("prev").onclick=function(){view.setMonth(view.getMonth()-1);render()};
  $("next").onclick=function(){view.setMonth(view.getMonth()+1);render()};

  [].forEach.call(document.querySelectorAll("#hrs [data-f]"),function(b){b.onclick=function(){saveHours(b.getAttribute("data-f"),b.getAttribute("data-t"),sel)}});
  $("hfrom").onchange=$("hto").onchange=function(){saveHours($("hfrom").value,$("hto").value,sel)};
  $("hall").onclick=function(){
    if(!need())return;
    var f=$("hfrom").value,t=$("hto").value;
    if(f&&t&&t<=f){alert("L’heure de fin doit être après le début.");return}
    var mine=monthDays().filter(function(d){return present[iso(d)+"_"+me]});
    if(!mine.length)return;
    Promise.all(mine.map(function(d){var k=iso(d);return col.doc(k+"_"+me).set({date:k,person:me,from:f,to:t,ts:Date.now()})})).catch(fail);
  };
  drawNames();render();
  var timer=setTimeout(function(){$("status").textContent="Connexion lente ou impossible… lecture seule pour l’instant."},10000);
  (window.claude?window.claude.use("db"):Promise.resolve(null)).then(function(d){
    if(!d){clearTimeout(timer);$("status").textContent="Connecte-toi pour voir et remplir le planning.";return}
    db=d;col=db.collection("presence");
    col.onSnapshot(function(snap){
      clearTimeout(timer);var m={};
      snap.docs.forEach(function(x){var v=x.data()||{};if(v.date&&v.person)m[v.date+"_"+v.person]={from:v.from||"",to:v.to||""}});
      present=m;$("status").textContent="Mise à jour en direct ✓";render();
    },function(){clearTimeout(timer);$("status").textContent="Erreur de chargement."});
  }).catch(function(){$("status").textContent="Base de données indisponible."});
})();
</script>
</body>
</html>
